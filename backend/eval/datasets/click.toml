# Questions about pallets/click, labelled by reading the code at `commit`.
#
# gold:    the code an answer can't be right without ("path::Qualified.name")
# mention: facts a correct answer states; each is a list of accepted phrasings
# See eval/dataset.py for the format.

repo = "https://github.com/pallets/click"
commit = "2247b35ea1c47c727d7a06e51fa280e12a863ff6"

# --- running a command ------------------------------------------------------------------

[[case]]
id = "standalone-mode"
kind = "behaviour"
question = "What does standalone_mode=False change when a command runs through Command.main?"
gold = ["src/click/core.py::Command.main"]
mention = [["propagat", "re-raise", "raised to the caller", "raises"], ["return value", "returns the", "returned"], ["exit code", "exit_code"]]

[[case]]
id = "script-entry"
kind = "call_flow"
question = "What happens, step by step, when a click command object is called like a function from a script?"
gold = ["src/click/core.py::Command.__call__", "src/click/core.py::Command.main", "src/click/core.py::Command.make_context"]
mention = [["main"], ["make_context"], ["sys.exit", "exits", "ctx.exit"]]

[[case]]
id = "ctx-invoke-command"
kind = "behaviour"
question = "When Context.invoke is given another Command instead of a plain function, how are that command's missing parameters filled in?"
gold = ["src/click/core.py::Context.invoke"]
mention = [["get_default", "default value", "defaults"], ["type_cast_value", "cast"], ["_make_sub_context", "sub-context", "new context", "sub context"]]

[[case]]
id = "ctx-forward"
kind = "behaviour"
question = "How does Context.forward differ from Context.invoke?"
gold = ["src/click/core.py::Context.forward", "src/click/core.py::Context.invoke"]
mention = [["self.params", "current context's param", "current parameters", "params"], ["TypeError", "only other commands", "not callbacks", "cannot invoke callbacks"]]

# --- groups --------------------------------------------------------------------------------

[[case]]
id = "group-dispatch"
kind = "call_flow"
question = "How does a Group find and run the subcommand named on the command line?"
gold = ["src/click/core.py::Group.invoke", "src/click/core.py::Group.resolve_command", "src/click/core.py::Group.get_command"]
mention = [["resolve_command"], ["get_command"], ["make_context"], ["invoked_subcommand"]]

[[case]]
id = "chain-mode"
kind = "behaviour"
question = "In chain mode, how does a Group run several subcommands, and what does its result callback receive?"
gold = ["src/click/core.py::Group.invoke"]
mention = [["list"], ["context", "contexts"], ["result callback", "result_callback", "_result_callback", "_process_result"]]

[[case]]
id = "unknown-subcommand"
kind = "behaviour"
question = "What happens when the subcommand name given on the command line doesn't exist?"
gold = ["src/click/core.py::Group.resolve_command", "src/click/exceptions.py::NoSuchCommand"]
mention = [["NoSuchCommand"], ["token_normalize_func", "normaliz"], ["looks like an option", "--help", "parse_args"]]

# --- parameters ---------------------------------------------------------------------------

[[case]]
id = "value-precedence"
kind = "behaviour"
question = "If a parameter isn't given on the command line, where does click look for its value, and in what order?"
gold = ["src/click/core.py::Parameter.consume_value"]
mention = [["environment", "envvar"], ["default_map", "default map"], ["get_default", "parameter's default", "default value"]]

[[case]]
id = "auto-envvar"
kind = "behaviour"
question = "How does auto_envvar_prefix build the environment variable name for an option?"
gold = ["src/click/core.py::Option.resolve_envvar_value"]
mention = [["auto_envvar_prefix"], ["upper", "uppercase", "upper-case"]]

[[case]]
id = "prompt-when"
kind = "behaviour"
question = "When does an option prompt the user for its value?"
gold = ["src/click/core.py::Option.consume_value", "src/click/core.py::Option.prompt_for_value"]
mention = [["prompt_for_value"], ["required", "prompt_required"], ["resilient_parsing", "resilient parsing"]]

[[case]]
id = "flag-without-value"
kind = "behaviour"
question = "What value does a flag option get when it's used without a value?"
gold = ["src/click/core.py::Option.consume_value", "src/click/core.py::Option.flag_activation_value"]
mention = [["flag_activation_value", "activation value", "flag_value"]]

[[case]]
id = "process-value"
kind = "behaviour"
question = "What steps does Parameter.process_value go through?"
gold = ["src/click/core.py::Parameter.process_value"]
mention = [["type_cast_value", "type cast", "convert"], ["MissingParameter", "required"], ["callback"]]

[[case]]
id = "lookup-default"
kind = "lookup"
question = "How does the context read a default from default_map, and are callable defaults called?"
gold = ["src/click/core.py::Context.lookup_default"]
mention = [["default_map"], ["callable", "called", "value()"]]

[[case]]
id = "parsing-to-callback"
kind = "architecture"
question = "How is a command line turned into the keyword arguments of the command's callback, from parsing to the call?"
gold = ["src/click/core.py::Command.parse_args", "src/click/core.py::Parameter.handle_parse_result", "src/click/parser.py::_OptionParser.parse_args"]
mention = [["make_parser", "_OptionParser", "parser"], ["handle_parse_result"], ["process_value", "consume_value"], ["ctx.params", "params"]]

# --- the context object -----------------------------------------------------------------

[[case]]
id = "find-ensure-object"
kind = "behaviour"
question = "How do find_object and ensure_object work on the context?"
gold = ["src/click/core.py::Context.find_object", "src/click/core.py::Context.ensure_object"]
mention = [["parent"], ["new instance", "object_type()", "creates", "instantiat", "sets"]]

[[case]]
id = "pass-decorator"
kind = "call_flow"
question = "How does a decorator made with make_pass_decorator find the object it passes to the function?"
