# Tool configuration shared by local runs, pre-commit and CI.

[tool.ruff]
target-version = "py312"
line-length = 120
extend-exclude = ["genv", "app/static"]

[tool.ruff.lint]
# E/F/W: pyflakes + pycodestyle basics; I: import sorting; B: likely bugs;
# UP: modern syntax; SIM: simplifications; RUF: ruff-specific checks.
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
ignore = [
    "E501",   # line length is handled by the formatter
]

[tool.ruff.lint.flake8-bugbear]
# FastAPI's dependency injection is designed around calls in argument defaults.
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["B011"]

[tool.mypy]
python_version = "3.12"
# Start lenient so CI can go green, then tighten over time
# (e.g. disallow_untyped_defs = true module by module).
ignore_missing_imports = true
check_untyped_defs = true
warn_unused_ignores = true
warn_redundant_casts = true
no_implicit_optional = true
exclude = ["genv/", "tests/"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = [
    "integration: needs running Neo4j, Qdrant and Redis (run with -m integration)",
]
# Unit tests only by default; CI's integration job opts in explicitly.
addopts = "-m 'not integration'"

[tool.coverage.run]
source = ["app"]
omit = ["app/static/*"]

[tool.coverage.report]
# Ratchet: just under current unit-test coverage (69%). Raise it as tests are added.
fail_under = 65
show_missing = true
skip_covered = true
