<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 560" width="1240" height="560" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#8f84bf"/>
    </marker>
    <style>
      .b{fill:#1b1540;stroke:#5a4b9c;stroke-width:1.4}
      .o{fill:#2a1d55;stroke:#b18cff;stroke-width:1.4}
      .s{fill:#12283a;stroke:#5fd6f2;stroke-width:1.4}
      .t{fill:#eeeaf8;font-size:14px;font-weight:700;text-anchor:middle}
      .d{fill:#cdc6e6;font-size:11.5px;text-anchor:middle}
      .h{fill:#a49cc8;font-size:12px;letter-spacing:.3px}
      .n{fill:#a49cc8;font-size:11.5px}
      .l{stroke:#8f84bf;stroke-width:1.4;fill:none;marker-end:url(#a)}
      .dl{stroke:#8f84bf;stroke-width:1.3;fill:none;stroke-dasharray:4 4;marker-end:url(#a)}
    </style>
  </defs>
  <rect width="1240" height="560" fill="#140f2e"/>
  <text x="24" y="50" fill="#fff" font-size="34" font-weight="800">Architecture</text>

  <!-- OFFLINE -->
  <text x="24" y="92" class="h">INDEX ONCE PER REPO (Celery worker, async)</text>
  <rect x="24" y="104" width="170" height="62" rx="8" class="b"/>
  <text x="109" y="130" class="t">GitHub repo</text><text x="109" y="149" class="d">git clone --depth 1, *.py</text>

  <rect x="234" y="104" width="190" height="62" rx="8" class="b"/>
  <text x="329" y="126" class="t">AST parse</text><text x="329" y="144" class="d">function / class / method</text><text x="329" y="158" class="d">exact line spans + call edges</text>

  <rect x="464" y="104" width="200" height="62" rx="8" class="b"/>
  <text x="564" y="126" class="t">Embed</text><text x="564" y="144" class="d">bge-small-en-v1.5 (384-d)</text><text x="564" y="158" class="d">FastEmbed, local · Redis cache</text>

  <rect x="720" y="96" width="230" height="40" rx="8" class="s"/>
  <text x="835" y="114" class="t">Qdrant</text><text x="835" y="129" class="d">cosine · one collection per model</text>
  <rect x="720" y="142" width="230" height="40" rx="8" class="s"/>
  <text x="835" y="160" class="t">RediSearch</text><text x="835" y="175" class="d">BM25 over symbol, path, code</text>
  <rect x="720" y="188" width="230" height="40" rx="8" class="s"/>
  <text x="835" y="206" class="t">Neo4j</text><text x="835" y="221" class="d">CALLS · INHERITS · HAS_METHOD</text>

  <path class="l" d="M194 135H232"/><path class="l" d="M424 135H462"/>
  <path class="l" d="M664 135H690V116H718"/><path class="l" d="M690 135V162H718"/>
  <path class="l" d="M424 150Q440 208 718 208"/>
  <path class="dl" d="M960 160H1010V250"/>
  <text x="1018" y="215" class="n">indexes read at query time</text>

  <!-- ONLINE -->
  <text x="24" y="282" class="h">EVERY QUESTION (LangGraph agent, streamed to UI)</text>
  <rect x="24" y="296" width="160" height="62" rx="8" class="o"/>
  <text x="104" y="322" class="t">Your question</text><text x="104" y="341" class="d">scoped to one repo</text>

  <rect x="222" y="296" width="200" height="62" rx="8" class="b"/>
  <text x="322" y="318" class="t">Query planner</text><text x="322" y="336" class="d">Gemini: type, symbols,</text><text x="322" y="350" class="d">up to 3 rewritten queries</text>

  <rect x="460" y="296" width="170" height="62" rx="8" class="b"/>
  <text x="545" y="318" class="t">Router</text><text x="545" y="336" class="d">vector · graph · hybrid</text><text x="545" y="350" class="d">by question type</text>

  <rect x="676" y="268" width="200" height="50" rx="8" class="b"/>
  <text x="776" y="289" class="t">Dense search</text><text x="776" y="306" class="d">Qdrant, top 20 per query</text>
  <rect x="676" y="336" width="200" height="50" rx="8" class="b"/>
  <text x="776" y="357" class="t">Sparse search</text><text x="776" y="374" class="d">BM25, top 20</text>

  <rect x="920" y="296" width="140" height="62" rx="8" class="b"/>
  <text x="990" y="322" class="t">RRF fusion</text><text x="990" y="341" class="d">k = 60</text>

  <path class="l" d="M184 327H220"/><path class="l" d="M422 327H458"/>
  <path class="l" d="M630 327H652V293H674"/><path class="l" d="M652 327V361H674"/>
  <path class="l" d="M876 293H898V327H918"/><path class="l" d="M876 361H898V327"/>

  <rect x="676" y="440" width="220" height="62" rx="8" class="b"/>
  <text x="786" y="462" class="t">Cross-encoder</text><text x="786" y="480" class="d">MiniLM-L-12, 24 → top 8</text><text x="786" y="494" class="d">0.75 rerank + 0.25 RRF</text>

  <rect x="460" y="440" width="180" height="62" rx="8" class="s"/>
  <text x="550" y="462" class="t">Graph expansion</text><text x="550" y="480" class="d">Neo4j, ≤ 3 hops, fan-out 10</text><text x="550" y="494" class="d">callers · callees · bases</text>

  <rect x="222" y="440" width="200" height="62" rx="8" class="o"/>
  <text x="322" y="462" class="t">Gemini</text><text x="322" y="480" class="d">3.5 flash-lite</text><text x="322" y="494" class="d">answer cited by file:line</text>

  <path class="l" d="M990 358V471H898"/>
  <path class="l" d="M676 471H642"/>
  <path class="l" d="M460 471H424"/>
  <path class="dl" d="M786 502V530H322V504"/>
  <text x="470" y="548" class="n">vector strategy skips the graph step</text>
</svg>
