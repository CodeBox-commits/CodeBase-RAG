# Weekly dependency update PRs; each one runs through CI before you merge it.
version: 2
updates:
  - package-ecosystem: pip
    directory: /backend
    schedule: { interval: weekly }
    groups:
      python-minor-patch:
        update-types: [minor, patch]
    ignore:
      # tree-sitter 0.26 segfaults with the published JS/TS grammar wheels; see requirements.txt.
      - dependency-name: tree-sitter
        versions: [">=0.26"]
  - package-ecosystem: npm
    directory: /frontend
    schedule: { interval: weekly }
    groups:
      npm-minor-patch:
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }
  - package-ecosystem: docker
    directory: /backend
    schedule: { interval: weekly }
