name: CI

on:
  pull_request:
  push:
    branches: [main]

# A new push to the same branch cancels the run that's still going.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Least privilege for the workflow token: read the code, nothing else.
permissions:
  contents: read

env:
  PYTHON_VERSION: "3.12"
  NODE_VERSION: "24"

jobs:
  # ---------------------------------------------------------------------------
  backend-lint:
    name: Backend · lint & types
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: pip install -r requirements-dev.txt
      - name: ruff (lint)
        run: ruff check . --output-format=github
      - name: ruff (format)
        run: ruff format --check .
      - name: mypy
        run: mypy app

  # ---------------------------------------------------------------------------
  backend-tests:
    name: Backend · unit tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: pip install -r requirements-dev.txt
      # Unit tests only (integration is deselected by default); coverage floor is in pyproject.toml.
      - run: pytest --cov --cov-report=term --cov-report=xml
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: coverage-xml
          path: backend/coverage.xml

  # ---------------------------------------------------------------------------
  integration:
    name: Backend · integration (Neo4j, Qdrant, Redis)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      redis:
        image: redis/redis-stack-server:latest
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 3s --health-retries 10
      neo4j:
        image: neo4j:5.18-community
        ports: ["7687:7687"]
        env:
          NEO4J_AUTH: neo4j/ci-password
        options: >-
          --health-cmd "cypher-shell -u neo4j -p ci-password 'RETURN 1'"
          --health-interval 10s --health-timeout 10s --health-retries 15
      qdrant:
        image: qdrant/qdrant:latest
        ports: ["6333:6333"]
    env:
      # Test-only credentials for the throwaway service containers above.
      REDIS_URL: redis://localhost:6379/0
      QDRANT_HOST: localhost
      QDRANT_PORT: "6333"
      NEO4J_URI: bolt://localhost:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: ci-password
      EMBEDDING_CACHE_TTL_SECONDS: "0"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: pip install -r requirements-dev.txt
      # The qdrant image has no health-check tool, so wait for its HTTP endpoint here.
      - name: Wait for Qdrant
        run: timeout 60 bash -c 'until curl -sf http://localhost:6333/readyz; do sleep 2; done'
      - run: pytest -m integration -v

  # ---------------------------------------------------------------------------
  frontend:
    name: Frontend · types, lint, build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      # `npm ci` installs exactly the lockfile and fails if it's out of sync with package.json.
      - run: npm ci
      - run: npx tsc -b
      - run: npx oxlint
      - run: npm run build

  # ---------------------------------------------------------------------------
  docker:
    name: Docker · image builds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      # Build only (no push); layers cached in GitHub Actions cache between runs.
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: backend/Dockerfile
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ---------------------------------------------------------------------------
  security:
    name: Security · secrets & dependencies
    runs-on: ubuntu-latest
    # gitleaks-action lists the PR's commits via the API, which needs pull-requests: read.
    # Granted only to this job; every other job keeps the read-only default.
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history so gitleaks can scan every commit in the PR
      - name: gitleaks (secret scan)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: pip-audit (Python dependencies)
        run: pip install pip-audit && pip-audit -r backend/requirements.txt
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: npm audit (frontend dependencies)
        working-directory: frontend
        run: npm audit --audit-level=high
