# Fast local checks on every `git commit`. CI runs the full suite either way.
# Setup once: pip install pre-commit && pre-commit install
repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.10 # keep in sync with backend/requirements-dev.txt
    hooks:
      - id: ruff-check
        args: [--fix]
        files: ^backend/
      - id: ruff-format
        files: ^backend/
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.24.2
    hooks:
      - id: gitleaks
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: check-yaml
      - id: check-added-large-files
        args: [--maxkb=1000]
      - id: end-of-file-fixer
        exclude: ^backend/app/static/
      - id: trailing-whitespace
        exclude: ^backend/app/static/
