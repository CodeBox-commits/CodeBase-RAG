x-backend: &backend
  build:
    context: .
    dockerfile: backend/Dockerfile
  env_file: ./backend/.env
  environment:
    # Container hostnames; these override the localhost values in backend/.env.
    - REDIS_URL=redis://redis:6379/0
    - QDRANT_HOST=qdrant
    - QDRANT_PORT=6333
    - NEO4J_URI=bolt://neo4j:7687
  depends_on:
    redis:
      condition: service_healthy
    neo4j:
      condition: service_healthy
    qdrant:
      condition: service_started
  restart: unless-stopped

services:

  api:
    <<: *backend
    container_name: git_rag_api
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000"]
    # Every port is published on this machine only (127.0.0.1): the API has no sign-in and the
    # databases use development passwords, so nothing here should be reachable from the network.
    ports:
      - "127.0.0.1:8000:8000"

  worker:
    <<: *backend
    container_name: git_rag_worker
    # Bounded concurrency (default is one process per CPU): each process holds the embedding model.
    command: ["celery", "-A", "app.workers.celery_app", "worker", "--loglevel=info", "--concurrency=2"]

  redis:
    image: redis/redis-stack:latest
    container_name: git_rag_redis
    ports:
      - "127.0.0.1:6379:6379"
      - "127.0.0.1:8001:8001"
    environment:
      # Append-only file on a volume: the BM25 index, embedding cache and task queue
      # survive `docker compose down` (same as deploy/docker-compose.prod.yml).
      - REDIS_ARGS=--appendonly yes
    volumes:
      - redis_data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  qdrant:
    image: qdrant/qdrant:latest
    container_name: git_rag_qdrant
    ports:
      - "127.0.0.1:6333:6333"
      - "127.0.0.1:6334:6334"
    volumes:
      - qdrant_storage:/qdrant/storage
    restart: unless-stopped

  neo4j:
    image: neo4j:5.18-community
    container_name: git_rag_neo4j
    ports:
      - "127.0.0.1:7474:7474"
      - "127.0.0.1:7687:7687"
    environment:
      - NEO4J_AUTH=neo4j/password123
      - NEO4J_PLUGINS=["apoc"]
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "cypher-shell", "-u", "neo4j", "-p", "password123", "RETURN 1"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  redis_data:
  qdrant_storage:
  neo4j_data:
  neo4j_logs:
